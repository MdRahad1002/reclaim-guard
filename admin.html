<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ReclaimGuard Legal</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/reclaim-guard-logo.png">
    <link rel="shortcut icon" href="assets/images/reclaim-guard-logo.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://reclaimguard.co.uk/admin">
    <meta property="og:title" content="Admin Dashboard | ReclaimGuard Legal">
    <meta property="og:description" content="ReclaimGuard Legal Admin Dashboard - Manage leads and cases.">
    <meta property="og:image" content="https://reclaimguard.co.uk/assets/images/reclaim-guard-logo.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://reclaimguard.co.uk/admin">
    <meta property="twitter:title" content="Admin Dashboard | ReclaimGuard Legal">
    <meta property="twitter:description" content="ReclaimGuard Legal Admin Dashboard">
    <meta property="twitter:image" content="https://reclaimguard.co.uk/assets/images/reclaim-guard-logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .admin-header {
            background: var(--primary-color);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--primary-color);
        }

        .stat-card p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 0.9rem;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .filter-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .filter-item label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .filter-item select,
        .filter-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .leads-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .export-btn {
            background: var(--secondary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .export-btn:hover {
            background: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            text-align: left;
            padding: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-new {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-contacted {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-qualified {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-unqualified {
            background: #ffebee;
            color: #d32f2f;
        }

        .amount-high {
            color: #2e7d32;
            font-weight: 600;
        }

        .amount-medium {
            color: #f57c00;
            font-weight: 600;
        }

        .amount-low {
            color: #666;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-view {
            background: #e3f2fd;
            color: #1976d2;
        }

        .btn-view:hover {
            background: #1976d2;
            color: white;
        }

        .btn-edit {
            background: #fff3e0;
            color: #f57c00;
        }

        .btn-edit:hover {
            background: #f57c00;
            color: white;
        }

        .no-leads {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-leads svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .page-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .page-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .page-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-delete {
            background: #ffebee;
            color: #d32f2f;
        }

        .btn-delete:hover {
            background: #d32f2f;
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-box {
            background: #fff;
            border-radius: 14px;
            width: 560px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-box h2 {
            margin: 0 0 24px;
            font-size: 1.4rem;
            color: #1B2B44;
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none; border: none;
            font-size: 1.6rem; cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .modal-close:hover { color: #333; }

        .modal-field {
            margin-bottom: 14px;
            font-size: 0.93rem;
            line-height: 1.6;
        }

        .modal-field strong { color: #333; margin-right: 6px; }

        .modal-field .msg-box {
            background: #f5f7fa;
            padding: 12px;
            border-radius: 6px;
            margin-top: 6px;
            white-space: pre-wrap;
            color: #555;
        }

        .modal-form-group {
            margin-bottom: 16px;
        }

        .modal-form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #333;
        }

        .modal-form-group select,
        .modal-form-group textarea,
        .modal-form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 7px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .modal-form-group select:focus,
        .modal-form-group textarea:focus,
        .modal-form-group input:focus {
            outline: none;
            border-color: #1B2B44;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 11px 24px;
            border: none;
            border-radius: 7px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-primary { background: #1B2B44; color: white; }
        .modal-btn-primary:hover { background: #0f1d30; }
        .modal-btn-secondary { background: #f0f0f0; color: #333; }
        .modal-btn-secondary:hover { background: #e0e0e0; }
        .modal-btn-danger { background: #ffebee; color: #d32f2f; }
        .modal-btn-danger:hover { background: #d32f2f; color: white; }

        .priority-high { color: #d32f2f; font-weight: 700; }
        .priority-medium { color: #f57c00; font-weight: 600; }
        .priority-low { color: #388e3c; }

        .login-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-logo h2 {
            color: #1B2B44;
            font-size: 1.5rem;
            margin: 10px 0 4px;
        }

        .login-logo p {
            color: #888;
            font-size: 0.9rem;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1B2B44;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 20000;
            animation: slideIn 0.3s ease;
        }

        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 800px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <div>
                <h1>📊 Admin Dashboard</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.9;" id="adminUser">ReclaimGuard Legal — Lead Management</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Stats -->
        <div class="admin-stats">
            <div class="stat-card">
                <h3 id="totalLeads">—</h3>
                <p>Total Leads</p>
            </div>
            <div class="stat-card">
                <h3 id="newLeads">—</h3>
                <p>New (Last 7 Days)</p>
            </div>
            <div class="stat-card">
                <h3 id="qualifiedLeads">—</h3>
                <p>Qualified Leads</p>
            </div>
            <div class="stat-card">
                <h3 id="highValueLeads">—</h3>
                <p>High-Value (€5k+)</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <div class="filter-item">
                    <label>Status</label>
                    <select id="filterStatus" onchange="applyFilters()">
                        <option value="">All Status</option>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="qualified">Qualified</option>
                        <option value="unqualified">Unqualified</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Fraud Type</label>
                    <select id="filterFraudType" onchange="applyFilters()">
                        <option value="">All Types</option>
                        <option value="crypto">Crypto Scam</option>
                        <option value="broker">Fake Trading Platform</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="card">Card Fraud</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Amount Range</label>
                    <select id="filterAmount" onchange="applyFilters()">
                        <option value="">All Amounts</option>
                        <option value="0-250">€0-250</option>
                        <option value="250-1000">€250-1,000</option>
                        <option value="1000-5000">€1,000-5,000</option>
                        <option value="5000+">€5,000+</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Search</label>
                    <input type="text" id="searchInput" placeholder="Name, email, phone..." oninput="debounceFilter()">
                </div>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="leads-table">
            <div class="table-header">
                <h2>All Leads</h2>
                <button class="export-btn" onclick="exportToCSV()">📥 Export CSV</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Contact</th>
                            <th>Amount</th>
                            <th>Fraud Type</th>
                            <th>When</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                        <tr><td colspan="9" style="text-align:center;padding:40px;color:#bbb;">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        // ─── CONFIG ───────────────────────────────────────────────
        const API_URL = '/api';
        const PAGE_SIZE = 20;

        let authToken  = localStorage.getItem('adminToken');
        let currentLeads = [];
        let currentFilters = {};
        let currentPage = 1;
        let filterTimer = null;

        // ─── BOOT ─────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            if (!authToken) {
                showLoginModal();
            } else {
                verifyToken();
            }
        });

        // ─── AUTH ─────────────────────────────────────────────────
        function showLoginModal() {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'loginOverlay';
            overlay.innerHTML = `
                <div class="modal-box" style="width:420px;">
                    <div class="login-logo">
                        <div style="font-size:2.5rem;">🔐</div>
                        <h2>Admin Login</h2>
                        <p>ReclaimGuard Legal Dashboard</p>
                    </div>
                    <form id="loginForm" autocomplete="off">
                        <div class="modal-form-group">
                            <label>Username</label>
                            <input type="text" id="loginUser" required autocomplete="username">
                        </div>
                        <div class="modal-form-group">
                            <label>Password</label>
                            <input type="password" id="loginPass" required autocomplete="current-password">
                        </div>
                        <div class="modal-actions" style="margin-top:8px;">
                            <button type="submit" class="modal-btn modal-btn-primary" style="width:100%;justify-content:center;">Sign In</button>
                        </div>
                        <div id="loginError" style="color:#c62828;margin-top:12px;text-align:center;font-size:0.9rem;display:none;"></div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await doLogin(
                    document.getElementById('loginUser').value,
                    document.getElementById('loginPass').value
                );
            });
            document.getElementById('loginUser').focus();
        }

        async function doLogin(username, password) {
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('adminToken', authToken);
                    document.getElementById('loginOverlay').remove();
                    document.getElementById('adminUser').textContent =
                        `Logged in as ${data.user.username} · ReclaimGuard Legal`;
                    loadDashboard();
                } else {
                    errEl.textContent = data.error || 'Login failed. Check credentials.';
                    errEl.style.display = 'block';
                }
            } catch {
                errEl.textContent = 'Cannot reach server. Is it running?';
                errEl.style.display = 'block';
            }
        }

        async function verifyToken() {
            try {
                const res = await fetch(`${API_URL}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('adminUser').textContent =
                        `Logged in as ${data.user.username} · ReclaimGuard Legal`;
                    loadDashboard();
                } else {
                    localStorage.removeItem('adminToken');
                    authToken = null;
                    showLoginModal();
                }
            } catch {
                showLoginModal();
            }
        }

        function logout() {
            if (!confirm('Logout from admin dashboard?')) return;
            localStorage.removeItem('adminToken');
            location.reload();
        }

        // ─── DASHBOARD ────────────────────────────────────────────
        async function loadDashboard() {
            await Promise.all([loadStats(), loadLeads()]);
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('totalLeads').textContent = data.stats.total;
                    document.getElementById('newLeads').textContent = data.stats.last7Days;
                    document.getElementById('qualifiedLeads').textContent = data.stats.qualified;
                    document.getElementById('highValueLeads').textContent = data.stats.highValue;
                }
            } catch {/* silent */}
        }

        async function loadLeads() {
            try {
                const params = new URLSearchParams(currentFilters);
                const res = await fetch(`${API_URL}/leads?${params}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (res.ok) {
                    currentLeads = data.leads;
                    currentPage = 1;
                    renderTable();
                    renderPagination();
                }
            } catch {
                document.getElementById('leadsTableBody').innerHTML =
                    '<tr><td colspan="9" style="text-align:center;padding:40px;color:#c62828;">⚠ Failed to load leads. Check server connection.</td></tr>';
            }
        }

        // ─── TABLE ────────────────────────────────────────────────
        function renderTable() {
            const tbody = document.getElementById('leadsTableBody');
            const start = (currentPage - 1) * PAGE_SIZE;
            const page  = currentLeads.slice(start, start + PAGE_SIZE);

            if (currentLeads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:60px;color:#bbb;">No leads found matching your filters.</td></tr>';
                return;
            }

            tbody.innerHTML = page.map(lead => `
                <tr>
                    <td style="white-space:nowrap;">${fmtDate(lead.createdAt)}</td>
                    <td><strong>${esc(lead.name)}</strong>
                        ${lead.priority === 'high' ? ' <span class="priority-high" title="High value">★</span>' : ''}</td>
                    <td>
                        <a href="mailto:${esc(lead.email)}" style="color:inherit;">${esc(lead.email)}</a><br>
                        <small style="color:#888;">${esc(lead.phone || '—')}</small>
                    </td>
                    <td class="amount-${getAmountClass(lead.amount)}">${esc(lead.amount)}</td>
                    <td>${fmtFraudType(lead.scamType)}</td>
                    <td style="white-space:nowrap;">${esc(lead.when || '—')}</td>
                    <td>${esc(lead.payment || '—')}</td>
                    <td><span class="status-badge status-${lead.status}">${lead.status}</span></td>
                    <td>
                        <div class="actions">
                            <button class="action-btn btn-view"   onclick="viewLead(${lead.id})">View</button>
                            <button class="action-btn btn-edit"   onclick="editLead(${lead.id})">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteLead(${lead.id},'${esc(lead.name)}')">Del</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination() {
            const total = currentLeads.length;
            const pages = Math.ceil(total / PAGE_SIZE);
            const pg = document.getElementById('pagination');
            if (pages <= 1) { pg.innerHTML = ''; return; }

            let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
            for (let i = 1; i <= pages; i++) {
                html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
            }
            html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next ›</button>`;
            pg.innerHTML = html;
        }

        function goPage(n) {
            const pages = Math.ceil(currentLeads.length / PAGE_SIZE);
            if (n < 1 || n > pages) return;
            currentPage = n;
            renderTable();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ─── FILTERS ──────────────────────────────────────────────
        function applyFilters() {
            currentFilters = {};
            const status    = document.getElementById('filterStatus').value;
            const fraudType = document.getElementById('filterFraudType').value;
            const amount    = document.getElementById('filterAmount').value;
            const search    = document.getElementById('searchInput').value.trim();
            if (status)    currentFilters.status    = status;
            if (fraudType) currentFilters.fraudType = fraudType;
            if (amount)    currentFilters.amount    = amount;
            if (search)    currentFilters.search    = search;
            loadLeads();
        }

        function debounceFilter() {
            clearTimeout(filterTimer);
            filterTimer = setTimeout(applyFilters, 350);
        }

        // ─── VIEW MODAL ───────────────────────────────────────────
        async function viewLead(id) {
            try {
                const res  = await fetch(`${API_URL}/leads/${id}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (!res.ok) { showToast('Cannot load lead details', 'error'); return; }
                const l = data.lead;
                openModal(`
                    <button class="modal-close" onclick="closeModal()">×</button>
                    <h2>Lead #${l.id} — ${esc(l.name)}</h2>
                    <div class="modal-field"><strong>Email:</strong> <a href="mailto:${esc(l.email)}">${esc(l.email)}</a></div>
                    <div class="modal-field"><strong>Phone:</strong> ${esc(l.phone||'—')}</div>
                    <div class="modal-field"><strong>Amount Lost:</strong> ${esc(l.amount)}</div>
                    <div class="modal-field"><strong>Fraud Type:</strong> ${fmtFraudType(l.scamType)}</div>
                    <div class="modal-field"><strong>When:</strong> ${esc(l.when||'—')}</div>
                    <div class="modal-field"><strong>Payment:</strong> ${esc(l.payment||'—')}</div>
                    <div class="modal-field"><strong>Status:</strong> <span class="status-badge status-${l.status}">${l.status}</span></div>
                    <div class="modal-field"><strong>Priority:</strong> <span class="priority-${l.priority}">${l.priority||'—'}</span></div>
                    <div class="modal-field"><strong>Submitted:</strong> ${new Date(l.createdAt).toLocaleString()}</div>
                    ${l.notes ? `<div class="modal-field"><strong>Notes:</strong><div class="msg-box">${esc(l.notes)}</div></div>` : ''}
                    <div class="modal-field"><strong>Description:</strong><div class="msg-box">${esc(l.message||'No description provided.')}</div></div>
                    <div class="modal-actions">
                        <button class="modal-btn modal-btn-primary" onclick="closeModal();editLead(${l.id})">Edit Lead</button>
                        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>
                    </div>
                `);
            } catch { showToast('Error loading lead', 'error'); }
        }

        // ─── EDIT MODAL ───────────────────────────────────────────
        function editLead(id) {
            const l = currentLeads.find(x => x.id === id);
            if (!l) return;
            openModal(`
                <button class="modal-close" onclick="closeModal()">×</button>
                <h2>Edit Lead #${l.id} — ${esc(l.name)}</h2>
                <div class="modal-form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="new"         ${l.status==='new'?'selected':''}>New</option>
                        <option value="contacted"   ${l.status==='contacted'?'selected':''}>Contacted</option>
                        <option value="qualified"   ${l.status==='qualified'?'selected':''}>Qualified</option>
                        <option value="unqualified" ${l.status==='unqualified'?'selected':''}>Unqualified</option>
                    </select>
                </div>
                <div class="modal-form-group">
                    <label>Priority</label>
                    <select id="editPriority">
                        <option value="high"   ${l.priority==='high'?'selected':''}>High</option>
                        <option value="medium" ${l.priority==='medium'?'selected':''}>Medium</option>
                        <option value="low"    ${l.priority==='low'?'selected':''}>Low</option>
                    </select>
                </div>
                <div class="modal-form-group">
                    <label>Internal Notes</label>
                    <textarea id="editNotes" rows="4" placeholder="Add case notes, follow-up actions...">${esc(l.notes||'')}</textarea>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn modal-btn-primary"   onclick="saveEdit(${l.id})">Save Changes</button>
                    <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="modal-btn modal-btn-danger"    onclick="closeModal();deleteLead(${l.id},'${esc(l.name)}')">Delete Lead</button>
                </div>
            `);
        }

        async function saveEdit(id) {
            const status   = document.getElementById('editStatus').value;
            const priority = document.getElementById('editPriority').value;
            const notes    = document.getElementById('editNotes').value.trim();
            try {
                const res = await fetch(`${API_URL}/leads/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status, priority, notes })
                });
                if (res.ok) {
                    closeModal();
                    showToast('Lead updated successfully', 'success');
                    await Promise.all([loadLeads(), loadStats()]);
                } else {
                    showToast('Failed to update lead', 'error');
                }
            } catch { showToast('Server error', 'error'); }
        }

        // ─── DELETE ───────────────────────────────────────────────
        function deleteLead(id, name) {
            openModal(`
                <button class="modal-close" onclick="closeModal()">×</button>
                <h2>Delete Lead?</h2>
                <p style="color:#555;margin-bottom:24px;">Are you sure you want to permanently delete the lead for <strong>${esc(name)}</strong>? This cannot be undone.</p>
                <div class="modal-actions">
                    <button class="modal-btn modal-btn-danger"    onclick="confirmDelete(${id})">Yes, Delete</button>
                    <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            `);
        }

        async function confirmDelete(id) {
            try {
                const res = await fetch(`${API_URL}/leads/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (res.ok) {
                    closeModal();
                    showToast('Lead deleted', 'success');
                    await Promise.all([loadLeads(), loadStats()]);
                } else {
                    showToast('Failed to delete lead', 'error');
                }
            } catch { showToast('Server error', 'error'); }
        }

        // ─── EXPORT ───────────────────────────────────────────────
        async function exportToCSV() {
            try {
                const res = await fetch(`${API_URL}/leads/export/csv`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (res.ok) {
                    const blob = await res.blob();
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement('a');
                    a.href = url;
                    a.download = `leads-${new Date().toISOString().split('T')[0]}.csv`;
                    a.click();
                    URL.revokeObjectURL(url);
                } else { showToast('Export failed', 'error'); }
            } catch { showToast('Export error', 'error'); }
        }

        // ─── MODAL HELPERS ────────────────────────────────────────
        function openModal(html) {
            closeModal();
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'activeModal';
            overlay.innerHTML = `<div class="modal-box">${html}</div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
        }

        function closeModal() {
            const m = document.getElementById('activeModal');
            if (m) m.remove();
        }

        // ─── TOAST ────────────────────────────────────────────────
        function showToast(msg, type = '') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        // ─── UTILS ────────────────────────────────────────────────
        function esc(str) {
            return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function fmtDate(iso) {
            return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
        }

        function getAmountClass(amount) {
            if (amount === '5000+') return 'high';
            if (amount === '1000-5000' || amount === '250-1000') return 'medium';
            return 'low';
        }

        function fmtFraudType(type) {
            return ({ crypto:'Crypto Scam', broker:'Fake Trading', bank:'Bank Transfer', card:'Card Fraud', other:'Other' })[type] || type || '—';
        }

        // ─── AUTO-REFRESH (60s) ───────────────────────────────────
        setInterval(() => {
            if (authToken && !document.getElementById('activeModal')) {
                loadStats();
                loadLeads();
            }
        }, 60000);

        // ─── KEYBOARD ─────────────────────────────────────────────
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
